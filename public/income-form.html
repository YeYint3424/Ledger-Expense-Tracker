        <div class="spine-brand">
          <span class="spine-brand-mark"><img src="imgs/logo.png" alt="Ledger logo" /></span>
          <span class="spine-brand-text">Ledger</span>
        </div>
        <ul class="spine-nav">
          <li>
            <a href="index.html" class="spine-link"
              ><span class="spine-icon">⌂</span><span>Home</span></a
            >
          </li>
          <li>
            <a href="transactions.html" class="spine-link active"
              ><span class="spine-icon">≡</span><span>Transactions</span></a
            >
          </li>
          <li>
            <a href="analytics.html" class="spine-link"
              ><span class="spine-icon">◔</span><span>Analytics</span></a
            >
          </li>
          <li>
            <a href="categories.html" class="spine-link"
              ><span class="spine-icon">▤</span><span>Categories</span></a
            >
          </li>
          <li>
            <a href="groups.html" class="spine-link"
              ><span class="spine-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="3"/><circle cx="5" cy="10" r="2.4"/><circle cx="19" cy="10" r="2.4"/><path d="M6 20c0-3 2.5-5 6-5s6 2 6 5"/><path d="M2 20c0-2 1-3.5 3-4"/><path d="M22 20c0-2-1-3.5-3-4"/></svg></span><span>Groups</span></a
            >
          </li>
          <li>
            <a href="friends.html" class="spine-link"
              ><span class="spine-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>Friends</span></a
            >
          </li>
          <li>
            <a href="messages.html" class="spine-link"
              ><span class="spine-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v13A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-13z"/><path d="m3.5 5 8.5 7 8.5-7"/></svg></span><span>Messages</span></a
            >
          </li>
          <li>
            <a href="profile.html" class="spine-link"
              ><span class="spine-icon"
                ><svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" /></svg></span
              ><span>Profile</span></a
            >
          </li>
        </ul>
        <div class="spine-footer">
          <div class="spine-user">
            <p class="spine-user-label">Signed in as</p>
            <p class="spine-user-name" id="currentUserName">…</p>
          </div>
          <button
            class="btn btn-ghost btn-block"
            id="logoutBtn"
            style="margin-top: 8px"
          >
            Log out
          </button>
        </div>
      </nav>

      <main class="content">
        <section class="page">
          <header class="page-head">
            <div>
              <p class="eyebrow">Income</p>
              <h1 class="page-title" id="incomeFormTitle">Add income</h1>
            </div>
            <div class="page-actions">
              <a href="transactions.html" class="btn btn-ghost"
                >← Back to transactions</a
              >
            </div>
          </header>

          <form id="incomeForm" class="form-card">
            <input type="hidden" id="incomeId" />
            <div class="field">
              <label for="incomeName">Name<span class="req">*</span></label>
              <input
                type="text"
                id="incomeName"
                class="input"
                required
                placeholder="e.g. Freelance payment"
              />
            </div>
            <div class="field">
              <label for="incomeAmount">Amount<span class="req">*</span></label>
              <input
                type="text"
                inputmode="decimal"
                id="incomeAmount"
                class="input"
                required
                placeholder="0.00"
              />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="incomeDate">Date<span class="req">*</span></label>
                <input type="date" id="incomeDate" class="input" required />
              </div>
              <div class="field">
                <label for="incomeTime">Time<span class="req">*</span></label>
                <input type="time" id="incomeTime" class="input" required />
              </div>
            </div>
            <div class="field">
              <label for="incomeDescription"
                >Description <span class="optional">(optional)</span></label
              >
              <textarea
                id="incomeDescription"
                class="input textarea"
                rows="3"
                placeholder="Add any notes…"
              ></textarea>
            </div>
            <div class="form-actions">
              <a href="transactions.html" class="btn btn-ghost">Cancel</a>
              <button type="submit" class="btn btn-income">Save income</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div class="fab-cluster">
      <a href="outcome-form.html" class="fab fab-outcome" title="Add outcome"
        >− Outcome</a
      >
      <a href="income-form.html" class="fab fab-income" title="Add income"
        >+ Income</a
      >
    </div>

        <a href="categories.html" class="tab-link"><span>&#9636;</span>Cats</a>
        <a href="profile.html" class="tab-link"

              fill="none"
              stroke="currentColor"

              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" /></svg></span

      </div>
