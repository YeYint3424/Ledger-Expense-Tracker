<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="spine-brand-mark">L</span>
        <span class="auth-brand-text">Ledger</span>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to see your own ledger.</p>

      <p class="auth-error" id="loginError" hidden></p>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            class="input"
            required
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            class="input"
            required
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p class="auth-switch">
        New here? <a href="register.html">Create an account</a>
      </p>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
