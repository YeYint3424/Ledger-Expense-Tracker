<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="imgs/logo.png" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="spine-brand-mark"><img src="imgs/logo.png" alt="Ledger logo" /></span>
        <span class="auth-brand-text">Ledger</span>
      </div>
      <h1 class="auth-title">Create your ledger</h1>
      <p class="auth-subtitle">
        Your income, outcomes, and categories stay private to your account.
      </p>

      <p class="auth-error" id="registerError" hidden></p>

      <form id="registerForm">
        <div class="field">
          <label for="registerName">Name</label>
          <input
            type="text"
            id="registerName"
            class="input"
            required
            placeholder="Your name"
            autocomplete="name"
          />
        </div>
        <div class="field">
          <label for="registerEmail">Email</label>
          <input
            type="email"
            id="registerEmail"
            class="input"
            required
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>
        <div class="field">
          <label for="registerPassword">Password</label>
          <input
            type="password"
            id="registerPassword"
            class="input"
            required
            minlength="6"
            placeholder="At least 6 characters"
            autocomplete="new-password"
          />
        </div>
        <div class="field">
          <label for="registerConfirm">Confirm password</label>
          <input
            type="password"
            id="registerConfirm"
            class="input"
            required
            minlength="6"
            placeholder="Repeat your password"
            autocomplete="new-password"
          />
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          Create account
        </button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
